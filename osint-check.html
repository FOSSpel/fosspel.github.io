<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSINT Intelligence Scanner | {FOSSpel}</title>
    <link rel="stylesheet" href="css/style.css?v=1.2">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #ff9d00; --bg-card: #1e1e1e; }
        .tool-container { max-width: 900px; margin: 40px auto; padding: 20px; }
        .input-box { 
            display: flex; gap: 10px; background: var(--bg-card); padding: 15px; 
            border-radius: 12px; border: 1px solid #333; margin-bottom: 30px;
        }
        .input-box input { 
            flex: 1; background: transparent; border: 1px solid #444; 
            color: #fff; padding: 12px; border-radius: 6px; outline: none;
        }
        .results-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .card { 
            background: var(--bg-card); border-radius: 12px; padding: 20px; 
            border: 1px solid #333; transition: 0.3s;
        }
        .card h3 { color: #50fa7b; margin-top: 0; font-size: 1rem; text-transform: uppercase; letter-spacing: 1px; }
        .data-item { margin: 10px 0; font-size: 0.95rem; line-height: 1.4; }
        .label { color: #888; font-size: 0.8rem; display: block; }
        .value { color: #eee; font-family: 'Courier New', monospace; }
        pre { background: #121212; padding: 10px; border-radius: 6px; color: #bd93f9; font-size: 0.8rem; white-space: pre-wrap; word-break: break-all; }
        .loader { width: 20px; height: 20px; border: 2px solid #50fa7b; border-bottom-color: transparent; border-radius: 50%; display: none; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
        .badge-red { background: #ff5555; color: #fff; }
        .badge-green { background: #50fa7b; color: #282a36; }
    </style>
</head>
<body>
    <div class="lang-switcher"><a href="ru-osint.html">RU</a> | <a href="osint-check.html" class="active">EN</a></div>
    
    <div class="tool-container">
        <header style="text-align: center; margin-bottom: 40px;">
             <a href="index.html"><img src="logo.svg" height="60"></a>
             <h1>OSINT Intel Scanner</h1>
             <p style="color: #888;">Verify domains, IPs and emails anonymously</p>
        </header>

        <div class="input-box">
            <input type="text" id="targetInput" placeholder="Enter domain (google.com), IP or email...">
            <button onclick="runScan()" class="button" id="btnText">Scan</button>
            <div class="loader" id="loader"></div>
        </div>

        <div class="results-grid" id="results" style="display: none;">
            <!-- Email Info -->
            <div class="card" id="emailCard" style="display:none;">
                <h3>Email Security</h3>
                <div id="emailData"></div>
            </div>

            <!-- Infrastructure -->
            <div class="card">
                <h3>Infrastructure & Geo</h3>
                <div id="geoData">
                    <div class="data-item"><span class="label">Status</span><span class="value">Waiting...</span></div>
                </div>
            </div>

            <!-- WHOIS -->
            <div class="card">
                <h3>Domain Registry (RDAP)</h3>
                <div id="whoisData"><pre>No search performed</pre></div>
                <div id="externalLink" style="margin-top:10px;"></div>
            </div>
        </div>
    </div>

    <script>
        async function runScan() {
            const input = document.getElementById('targetInput').value.trim();
            if(!input) return;

            // UI State
            document.getElementById('loader').style.display = 'block';
            document.getElementById('btnText').style.display = 'none';
            document.getElementById('results').style.display = 'grid';
            
            const isEmail = input.includes('@');
            const target = isEmail ? input.split('@')[1] : input;

            document.getElementById('emailCard').style.display = isEmail ? 'block' : 'none';

            try {
                // Выполняем запросы
                const [emailRes, geoRes, whoisRes] = await Promise.allSettled([
                    isEmail ? fetch(`https://disposable.debounce.io/?email=${input}`).then(r => r.json()) : null,
                    fetch(`https://ipapi.co/${target}/json/`).then(r => r.json()),
                    fetch(`https://rdap.org/domain/${target}`).then(r => r.json())
                ]);

                // 1. Email Logic
                if (isEmail && emailRes.status === 'fulfilled' && emailRes.value) {
                    const disp = emailRes.value.disposable === "true";
                    document.getElementById('emailData').innerHTML = `
                        <div class="data-item">
                            <span class="badge ${disp ? 'badge-red' : 'badge-green'}">${disp ? 'DISPOSABLE' : 'PERMANENT'}</span>
                            <p style="font-size:0.8rem; color:#888; margin-top:10px;">${disp ? 'This is a temporary/burn mail.' : 'Safe provider.'}</p>
                        </div>`;
                }

                // 2. Geo Logic (ipapi.co)
                if (geoRes.status === 'fulfilled' && !geoRes.value.error) {
                    const g = geoRes.value;
                    document.getElementById('geoData').innerHTML = `
                        <div class="data-item"><span class="label">IP Address</span><span class="value">${g.ip || 'N/A'}</span></div>
                        <div class="data-item"><span class="label">Location</span><span class="value">📍 ${g.country_name}, ${g.city}</span></div>
                        <div class="data-item"><span class="label">ISP</span><span class="value">🏢 ${g.org || 'N/A'}</span></div>
                        <div class="data-item"><span class="label">ASN</span><span class="value">🔢 ${g.asn || 'N/A'}</span></div>
                    `;
                } else {
                    document.getElementById('geoData').innerHTML = `<p style="color:#ff5555">Infrastructure data unavailable for this target.</p>`;
                }

                // 3. WHOIS/RDAP Logic
                if (whoisRes.status === 'fulfilled' && whoisRes.value && !whoisRes.value.errorCode) {
                    const w = whoisRes.value;
                    const registrar = w.entities ? w.entities[0].vcardArray[1][1][3] : 'Unknown';
                    document.getElementById('whoisData').innerHTML = `<pre>Registrar: ${registrar}\nStatus: ${w.status ? w.status[0] : 'Active'}\nRDAP Source: rdap.org</pre>`;
                } else {
                    document.getElementById('whoisData').innerHTML = `<p style="color:#888">RDAP failed for this TLD.</p>`;
                }
                
                // Всегда даем ссылку на ручную проверку, если это домен
                if (!isEmail || target) {
                    document.getElementById('externalLink').innerHTML = `<a href="https://who.is/whois/${target}" target="_blank" class="button" style="font-size:0.7rem; padding: 5px 10px;">Full WHOIS Report ↗</a>`;
                }

            } catch (err) {
                console.error(err);
            } finally {
                document.getElementById('loader').style.display = 'none';
                document.getElementById('btnText').style.display = 'block';
            }
        }
    </script>
</body>
</html>
